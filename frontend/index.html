<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         FAVICON
    ====================================================== -->
    <link
      rel="icon"
      type="image/png"
      href="/rs-logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/rs-logo.png"
    />

    <!-- Open the connections the shop needs while the page is still loading -->
    <link rel="preconnect" href="https://rs-fashions.onrender.com" crossorigin />
    <link rel="preconnect" href="https://img.rsfashions25.com" crossorigin />
    <link rel="dns-prefetch" href="https://rs-fashions.onrender.com" />
    <link rel="dns-prefetch" href="https://img.rsfashions25.com" />

    <!-- =====================================================
         VIEWPORT
    ====================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      RS Fashions — Sarees, Thoughtfully chosen
    </title>

    <meta
      name="description"
      content="Discover beautifully curated sarees at RS Fashions — from elegant cottons and luxurious silks to timeless handloom and bridal heritage collections."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="author"
      content="RS Fashions"
    />

    <meta
      name="theme-color"
      content="#FAF7F2"
    />

    <link
      rel="canonical"
      href="https://www.rsfashions25.com/"
    />

    <!-- =====================================================
         OPEN GRAPH
         
         This controls the preview when the website is
         shared on WhatsApp, Facebook, LinkedIn, etc.
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="RS Fashions"
    />

    <meta
      property="og:title"
      content="RS Fashions — Sarees, Thoughtfully chosen"
    />

    <meta
      property="og:description"
      content="Discover beautifully curated sarees, from elegant cottons and luxurious silks to timeless handloom and bridal heritage collections."
    />

    <meta
      property="og:url"
      content="https://www.rsfashions25.com/"
    />

    <!--
      IMPORTANT:
      Place og-image.jpg inside:

      public/og-image.jpg

      Recommended size:
      1200 × 630 px
    -->

    <meta
      property="og:image"
      content="https://www.rsfashions25.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="RS Fashions — Sarees, Thoughtfully chosen"
    />

    <!-- =====================================================
         TWITTER / X CARD
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="RS Fashions — Sarees, Thoughtfully chosen"
    />

    <meta
      name="twitter:description"
      content="Discover beautifully curated sarees, from elegant cottons and luxurious silks to timeless handloom and bridal heritage collections."
    />

    <meta
      name="twitter:image"
      content="https://www.rsfashions25.com/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="RS Fashions — Sarees, Thoughtfully chosen"
    />

  </head>

  <body>
    <div id="root"></div>

    <!-- Razorpay Standard Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>
</html>
