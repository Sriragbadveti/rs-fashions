<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         FAVICON
    ====================================================== -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/saree.png"
    />

    <link
      rel="apple-touch-icon"
      href="/saree.png"
    />

    <!-- =====================================================
         VIEWPORT
    ====================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      BECHO — Timeless Sarees, Beautifully Curated
    </title>

    <meta
      name="description"
      content="Discover beautifully curated sarees at BECHO — from elegant cottons and luxurious silks to timeless handloom and bridal heritage collections."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="author"
      content="BECHO"
    />

    <meta
      name="theme-color"
      content="#FAF7F2"
    />

    <!-- =====================================================
         CANONICAL
         
         CHANGE THIS TO YOUR REAL DOMAIN AFTER DEPLOYMENT.
         
         Example:
         https://becho.in/
    ====================================================== -->

    <link
      rel="canonical"
      href="https://YOUR-DOMAIN.com/"
    />

    <!-- =====================================================
         OPEN GRAPH
         
         This controls the preview when the website is
         shared on WhatsApp, Facebook, LinkedIn, etc.
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="BECHO"
    />

    <meta
      property="og:title"
      content="BECHO — Timeless Sarees, Beautifully Curated"
    />

    <meta
      property="og:description"
      content="Discover beautifully curated sarees, from elegant cottons and luxurious silks to timeless handloom and bridal heritage collections."
    />

    <meta
      property="og:url"
      content="https://YOUR-DOMAIN.com/"
    />

    <!--
      IMPORTANT:
      Place og-image.jpg inside:

      public/og-image.jpg

      Recommended size:
      1200 × 630 px
    -->

    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="BECHO — Timeless Sarees, Beautifully Curated"
    />

    <!-- =====================================================
         TWITTER / X CARD
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="BECHO — Timeless Sarees, Beautifully Curated"
    />

    <meta
      name="twitter:description"
      content="Discover beautifully curated sarees, from elegant cottons and luxurious silks to timeless handloom and bridal heritage collections."
    />

    <meta
      name="twitter:image"
      content="https://YOUR-DOMAIN.com/og-image.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="BECHO — Timeless Sarees, Beautifully Curated"
    />

  </head>

  <body>
    <div id="root"></div>

    <!-- Razorpay Standard Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>
</html>
