<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Product Showcase</title>

<style>
  /* =========================================================
     1. THEME VARIABLES — change colors/sizes here only
  ========================================================= */
  :root {
    --bg-color: #faf6f2;
    --accent: #7a1332;
    --accent-light: #a8395c;
    --gold: #d9a441;
    --text-dark: #1e1e1e;
    --text-muted: #7a7a7a;
    --border-color: #ececec;
    --transition-speed: 0.5s;   /* master speed for slide/fade swap */
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  /* No card, no centering box — this IS the page */
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-color);
    overflow: hidden; /* single full-screen "hero" section, no scrollbar */
  }

  /* =========================================================
     2. FULL SCREEN LAYOUT
     3 zones across the entire viewport:
     curved thumbnail rail | main image | info panel
  ========================================================= */
  .showcase {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: 160px 1fr 420px;
    align-items: center;
    padding: 0 60px;
    gap: 20px;
  }

  @media (max-width: 900px) {
    .showcase {
      grid-template-columns: 90px 1fr;
      padding: 0 20px;
    }
    .info-panel { display: none; } /* keep it simple on small screens */
  }

  /* =========================================================
     3. LEFT — CURVED "Change look" THUMBNAIL RAIL
     Thumbnails are positioned with JS along a bezier curve
     (absolute left/top), not stacked in a straight column.
  ========================================================= */
  .curve-rail {
    position: relative;
    width: 140px;
    height: 68vh;
    margin: auto 0;
  }

  .rail-label {
    position: absolute;
    top: -34px;
    left: 10px;
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    white-space: nowrap;
  }

  .thumb-cutout {
    position: absolute;         /* placed by JS using bezier x/y */
    width: 76px;
    height: 108px;
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: #fff;
    /* soft floating shadow so it reads as a cutout, not a boxed card */
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.18));
    transition: transform 0.3s ease, filter 0.3s ease;
  }

  .thumb-cutout:hover {
    transform: scale(1.08) translateY(-4px);
  }

  /* Active thumbnail gets a glowing frame outline, like the reference */
  .thumb-cutout.active {
    box-shadow: 0 0 0 3px #fff, 0 0 22px 4px rgba(122,19,50,0.35);
  }

  /* =========================================================
     4. CENTER — Main product visual + arrows
     No box/border here — the image floats directly on the
     page background so the whole thing feels full-bleed.
  ========================================================= */
  .main-stage {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .product-visual {
    width: min(60vw, 620px);
    height: 78vh;
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    font-size: 110px;
    color: #fff;
    filter: drop-shadow(0 25px 35px rgba(0,0,0,0.15));
    /* THIS is the slide + fade transition triggered by JS classes */
    transition: transform var(--transition-speed) ease, opacity var(--transition-speed) ease;
  }

  .product-visual span.label {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* --- Slide/fade states, toggled by JavaScript --- */
  .slide-out-left  { transform: translateX(-90px); opacity: 0; }
  .slide-out-right { transform: translateX(90px);  opacity: 0; }
  .slide-in-from-right { transform: translateX(90px);  opacity: 0; }
  .slide-in-from-left  { transform: translateX(-90px); opacity: 0; }
  .slide-settled { transform: translateX(0); opacity: 1; }

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.9);
    color: var(--text-dark);
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    z-index: 5;
    transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }
  .nav-arrow:hover {
    background: var(--accent);
    color: #fff;
    transform: translateY(-50%) scale(1.12);
    box-shadow: 0 10px 24px rgba(122,19,50,0.35);
  }
  .nav-arrow:active { transform: translateY(-50%) scale(0.95); }

  .arrow-left  { left: 0; }
  .arrow-right { right: 0; }

  .drop-caption {
    position: absolute;
    bottom: 30px;
    left: calc(50% - min(30vw, 310px));
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
  }

  .lookbook-btn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    border: none;
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .lookbook-btn:hover {
    background: #fff;
    transform: translateX(-50%) scale(1.06);
  }

  /* =========================================================
     5. RIGHT — Info panel
  ========================================================= */
  .info-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
  }
  .info-panel.info-hidden {
    opacity: 0;
    transform: translateY(8px);
  }

  .rating-row { color: var(--gold); font-size: 15px; }
  .rating-row .review-count { color: var(--text-muted); margin-left: 6px; font-size: 13px; }

  .product-title { font-size: 26px; font-weight: 700; color: var(--text-dark); margin: 0; }
  .product-price { font-size: 22px; font-weight: 600; color: var(--accent); margin: 0; }
  .product-desc  { font-size: 14px; color: var(--text-muted); line-height: 1.6; max-width: 340px; }

  .option-label {
    font-size: 12px; font-weight: 600; color: var(--text-dark);
    text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px;
  }

  .size-options { display: flex; gap: 8px; }
  .size-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border-color); background: #fff;
    cursor: pointer; font-size: 12px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .size-btn:hover { transform: translateY(-2px); }
  .size-btn.selected { background: var(--text-dark); color: #fff; border-color: var(--text-dark); }

  .color-options { display: flex; gap: 10px; }
  .color-swatch {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .color-swatch:hover { transform: scale(1.15); }
  .color-swatch.selected { border-color: var(--text-dark); box-shadow: 0 0 0 2px #fff inset; }

  .add-to-cart {
    margin-top: 20px;
    align-self: flex-start;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 15px 30px;
    border-radius: 30px 6px 30px 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    box-shadow: 0 10px 24px rgba(122,19,50,0.25);
  }
  .add-to-cart .arrow-icon { transition: transform 0.25s ease; }
  .add-to-cart:hover {
    background: var(--accent-light);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(122,19,50,0.35);
  }
  .add-to-cart:hover .arrow-icon { transform: translateX(4px); }
  .add-to-cart.added { background: #2f8f4e; }
</style>
</head>
<body>

<div class="showcase">

  <!-- LEFT: curved thumbnail rail (positions set by JS) -->
  <div class="curve-rail" id="curveRail">
    <div class="rail-label">Change look ↴</div>
  </div>

  <!-- CENTER: main product image + arrows -->
  <div class="main-stage">
    <button class="nav-arrow arrow-left" id="prevBtn">&#8249;</button>

    <div class="product-visual" id="productImage"></div>

    <span class="drop-caption">New Drop 2026</span>
    <button class="lookbook-btn">&#9658; Watch lookbook</button>
    <button class="nav-arrow arrow-right" id="nextBtn">&#8250;</button>
  </div>

  <!-- RIGHT: info panel -->
  <div class="info-panel" id="infoPanel">
    <div class="rating-row">
      &#9733;&#9733;&#9733;&#9733;&#9734;
      <span class="review-count" id="reviewCount"></span>
    </div>
    <h2 class="product-title" id="productTitle"></h2>
    <p class="product-price" id="productPrice"></p>
    <p class="product-desc" id="productDesc"></p>

    <div class="option-label">Select size</div>
    <div class="size-options">
      <button class="size-btn">S</button>
      <button class="size-btn selected">M</button>
      <button class="size-btn">L</button>
      <button class="size-btn">XL</button>
    </div>

    <div class="option-label">Select colour</div>
    <div class="color-options" id="colorOptions"></div>

    <button class="add-to-cart" id="addToCartBtn">
      Add to Cart <span class="arrow-icon">&#8594;</span>
    </button>
  </div>

</div>

<script>
/* =========================================================
   6. PRODUCT DATA — replace with your real products/photos.
   To use real images instead of emoji placeholders, swap the
   innerHTML lines in fillContent()/buildThumbnails() with
   <img src="yourfile.png"> (ideally a transparent PNG cutout).
========================================================= */
const products = [
  { emoji: "🥻", bgColor: "#d8b98a", name: "IVORY ORGANZA BLOOM",
    price: "₹18,400", reviews: "(120 reviews)",
    desc: "A delicate ivory organza saree finished with hand-embroidered floral motifs — perfect for evening events.",
    colors: ["#e8dcc8", "#e8a3ab", "#7a1332"] },

  { emoji: "🥻", bgColor: "#e8a3ab", name: "ROSÉ NET EMBROIDERED",
    price: "₹21,600", reviews: "(98 reviews)",
    desc: "A rose-net saree with fine embroidery and a soft drape — light, romantic, and made for golden hour.",
    colors: ["#e8dcc8", "#e8a3ab", "#7a1332"] },

  { emoji: "🥻", bgColor: "#a01e2e", name: "CRIMSON SILK CLASSIC",
    price: "₹24,900", reviews: "(210 reviews)",
    desc: "A rich crimson silk saree with a traditional zari border — bold, elegant, festival-ready.",
    colors: ["#e8dcc8", "#e8a3ab", "#a01e2e"] }
];

let currentIndex = 0;
let isAnimating = false;

const productImageEl = document.getElementById("productImage");
const infoPanelEl     = document.getElementById("infoPanel");
const productTitleEl  = document.getElementById("productTitle");
const productPriceEl  = document.getElementById("productPrice");
const productDescEl   = document.getElementById("productDesc");
const reviewCountEl   = document.getElementById("reviewCount");
const colorOptionsEl  = document.getElementById("colorOptions");
const curveRailEl     = document.getElementById("curveRail");

/* =========================================================
   7. BEZIER CURVE POSITIONING FOR THE THUMBNAIL RAIL
   This is what replaces the "straight line" stack — each
   thumbnail's x/y is computed along a quadratic bezier curve
   instead of just stacking with margin-top.
========================================================= */

// Standard quadratic bezier formula: B(t) = (1-t)^2 P0 + 2(1-t)t P1 + t^2 P2
function bezierPoint(t, p0, p1, p2) {
  const x = (1 - t) ** 2 * p0.x + 2 * (1 - t) * t * p1.x + t ** 2 * p2.x;
  const y = (1 - t) ** 2 * p0.y + 2 * (1 - t) * t * p1.y + t ** 2 * p2.y;
  return { x, y };
}

function buildThumbnails() {
  const railHeight = curveRailEl.clientHeight;

  // Control points describing the curve shape:
  // start upper-right -> bulge left in the middle -> end lower-right.
  // Tweak p1.x (the middle control point) to make the curve
  // more or less pronounced.
  const p0 = { x: 55, y: 0 };
  const p1 = { x: -10, y: railHeight * 0.5 };
  const p2 = { x: 45, y: railHeight - 108 };

  products.forEach((product, index) => {
    const t = products.length === 1 ? 0 : index / (products.length - 1);
    const pos = bezierPoint(t, p0, p1, p2);

    const thumb = document.createElement("div");
    thumb.className = "thumb-cutout" + (index === 0 ? " active" : "");
    thumb.style.left = pos.x + "px";
    thumb.style.top  = pos.y + "px";
    thumb.style.background = product.bgColor;
    thumb.textContent = product.emoji;

    thumb.addEventListener("click", () => {
      if (index !== currentIndex) {
        goToProduct(index, index > currentIndex ? "next" : "prev");
      }
    });

    curveRailEl.appendChild(thumb);
  });
}

/* =========================================================
   8. FILL CONTENT (image + info panel) for a given product
========================================================= */
function fillContent(product) {
  productImageEl.style.background = product.bgColor;
  productImageEl.innerHTML = `${product.emoji}<span class="label">${product.name}</span>`;

  productTitleEl.textContent = product.name;
  productPriceEl.textContent = product.price;
  productDescEl.textContent  = product.desc;
  reviewCountEl.textContent  = product.reviews;

  colorOptionsEl.innerHTML = "";
  product.colors.forEach((color, i) => {
    const swatch = document.createElement("div");
    swatch.className = "color-swatch" + (i === 0 ? " selected" : "");
    swatch.style.background = color;
    swatch.addEventListener("click", () => {
      document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
      swatch.classList.add("selected");
    });
    colorOptionsEl.appendChild(swatch);
  });
}

/* =========================================================
   9. CORE ANIMATION — slide left/right + fade in/out
   1. old image slides out one direction and fades to 0
   2. once invisible, content is swapped
   3. new image is placed off-screen on the other side
   4. it then slides + fades back into place
========================================================= */
function goToProduct(newIndex, direction) {
  if (isAnimating) return;
  isAnimating = true;

  const exitClass  = direction === "next" ? "slide-out-left"  : "slide-out-right";
  const enterClass = direction === "next" ? "slide-in-from-right" : "slide-in-from-left";

  productImageEl.classList.add(exitClass);
  infoPanelEl.classList.add("info-hidden");

  setTimeout(() => {
    currentIndex = newIndex;
    fillContent(products[currentIndex]);

    document.querySelectorAll(".thumb-cutout").forEach((thumb, i) => {
      thumb.classList.toggle("active", i === currentIndex);
    });

    productImageEl.classList.remove(exitClass);
    productImageEl.classList.add(enterClass);
    void productImageEl.offsetWidth; // force reflow so the "off-screen" state registers

    requestAnimationFrame(() => {
      productImageEl.classList.remove(enterClass);
      productImageEl.classList.add("slide-settled");
      infoPanelEl.classList.remove("info-hidden");
    });

    setTimeout(() => {
      productImageEl.classList.remove("slide-settled");
      isAnimating = false;
    }, 500);

  }, 500); // must match --transition-speed in CSS
}

/* =========================================================
   10. ARROW EVENTS (with wrap-around)
========================================================= */
document.getElementById("nextBtn").addEventListener("click", () => {
  goToProduct((currentIndex + 1) % products.length, "next");
});
document.getElementById("prevBtn").addEventListener("click", () => {
  goToProduct((currentIndex - 1 + products.length) % products.length, "prev");
});

/* =========================================================
   11. ADD TO CART CONFIRMATION
========================================================= */
document.getElementById("addToCartBtn").addEventListener("click", function () {
  this.classList.add("added");
  this.innerHTML = "Added to Cart ✓";
  setTimeout(() => {
    this.classList.remove("added");
    this.innerHTML = "Add to Cart <span class='arrow-icon'>&#8594;</span>";
  }, 1200);
});

/* =========================================================
   12. INITIAL LOAD
========================================================= */
buildThumbnails();
fillContent(products[currentIndex]);
</script>

</body>
</html>
